services:
  receiver-a:
    build: ./receiver
    container_name: telemetry-receiver-a
    environment:
      RECEIVER_NAME: A
      LISTEN_PORT: "9001"
      REPLY_DELAY: "0"          # 默认回包延迟（秒）；报文 "DELAY:<秒>:" 可单次覆盖
    networks: [telemetry]

  receiver-b:
    build: ./receiver
    container_name: telemetry-receiver-b
    environment:
      RECEIVER_NAME: B
      LISTEN_PORT: "9001"
      REPLY_DELAY: "0"
      # 演示“差异”时可让本地接收器返回不同内容，例如：
      # REPLY_TEMPLATE: "B:{payload}"
    networks: [telemetry]

  proxy:
    build: ./proxy
    container_name: telemetry-proxy
    environment:
      UDP_LISTEN_PORT: "9000"
      HTTP_PORT: "8080"
      SESSION_IDLE_TIMEOUT: "5"          # 会话空闲超时（秒）
      RECEIVER_A_HOST: receiver-a
      RECEIVER_A_PORT: "9001"
      RECEIVER_B_HOST: receiver-b
      RECEIVER_B_PORT: "9001"
      DB_PATH: /data/proxy.db            # 目标接收器持久化（重启保留）
      # UPSTREAM_PORT_COOLDOWN: "30"     # 上游端口冷却，须大于最大回包延迟
      SHADOW_WINDOW: "10"                # 影子校验：开启后绑定新会话的窗口（秒）
      SHADOW_LIMIT: "16"                 # 影子校验：每会话最多比较多少条上行
      # SHADOW_DRAIN: "1"                # 手动结束后的收尾时间（秒）
      # SHADOW_MAX_DURATION: "75"        # 单次校验总时长上限（秒）
    ports:
      - "9000:9000/udp"                  # 遥测终端发往这里
      - "8080:8080"                      # 操作网页
    volumes:
      - proxy-data:/data
    depends_on:
      - receiver-a
      - receiver-b
    networks: [telemetry]

networks:
  telemetry:

volumes:
  proxy-data:
